  items:
    - { name: Python, icon: python.svg }
    - { name: R, icon: r.svg }
    - { name: Stata, icon: stata.svg }
    - { name: Jupyter Notebook, icon: jupyter.svg }
    - { name: Quarto, icon: quarto.svg }
    - { name: pandas, icon: pandas.svg }
    - { name: NumPy, icon: numpy.svg }
    - { name: Matplotlib, icon: matplotlib.svg }
    - { name: ggplot2, icon: ggplot2.svg }
    - { name: scikit-learn, icon: scikitlearn.svg }
    - { name: PyTorch, icon: pytorch.svg }
    - { name: Anaconda, icon: anaconda.svg }
    - { name: LaTeX, icon: latex.svg }
    - { name: Google Cloud (Vertex AI), icon: gcp.svg }
    - { name: Docker, icon: docker.svg }
    - { name: Git, icon: git.svg }
    - { name: GitHub, icon: github.svg }
    - { name: Linux, icon: linux.svg }
    - { name: Selenium, icon: selenium.svg }
- group: Methods
