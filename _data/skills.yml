# Skill icons shown on the homepage, in display order, grouped into rows.
# SVGs live in assets/img/skills/. Sources:
#   - tandpfun/skill-icons (MIT): python, r, pytorch, scikitlearn, anaconda, latex,
#     gcp, docker, git, github, linux, selenium
#   - devicons/devicon (MIT): jupyter, pandas, numpy, matplotlib
#   - simple-icons (CC0): quarto;  rstudio/hex-stickers (CC0): ggplot2
#   - custom tiles in the same style: stata, econometrics, quasi-experiments,
#     ab-testing, mmm, mta
