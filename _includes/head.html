<head>
  {% if jekyll.environment == "production" %}
  <!-- Google tag (gtag.js). Production only (GitHub Pages), so local previews
       don't show up in Analytics. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L78BDKH6QP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-L78BDKH6QP');
  </script>
  {% endif %}

  <base href="{{ site.url }}{{ site.baseurl }}/">
  <link href="https://gmpg.org/xfn/11" rel="profile">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Enable responsiveness on mobile devices-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  {% if page.title == "Home" %}
  <meta name="description" content="Econometrist and Data Scientist. PhD in Quantitative Marketing (McMaster), Master of Financial Economics (BSE). Research: value appropriation, privacy policy, Gen AI in the mobile app ecosystem.">
  {% endif %}

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- CSS (relative to base URL so subpages load correctly) -->
  <link rel="stylesheet" href="public/css/poole.css">
  <link rel="stylesheet" href="public/css/syntax.css">
  <link rel="stylesheet" href="public/css/hyde.css">
  <link rel="stylesheet" href="public/css/custom.css">
  <link rel="stylesheet" href="public/css/motion.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Sans:400,400italic,700|Abril+Fatface">

  <!-- Icons -->
  <link rel="shortcut icon" href="public/favicon.ico">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="RSS" href="atom.xml">
</head>
